<script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Evitamos que la página se congele

        const btn = document.getElementById('main-register-btn');
        btn.innerText = 'CONFIGURANDO TU PERFIL...';
        btn.disabled = true;

        const nombreVal = document.getElementById('nombre').value;
        const emailVal = document.getElementById('email').value;
        const telefonoVal = document.getElementById('telefono').value;

        // 1. Guardamos la sesión local para que el perfil personal abra al instante
        const userSession = {
            nombre: nombreVal,
            email: emailVal,
            telefono: telefonoVal,
            fechaRegistro: new Date().toISOString()
        };
        localStorage.setItem('cla_user_session', JSON.stringify(userSession));

        // 2. Enviamos los datos a FormSubmit en segundo plano por fetch (para que llegue a eatramites1@gmail.com sin bloquear la pantalla)
        const formData = new FormData(this);
        fetch("https://formsubmit.co/ajax/eatramites1@gmail.com", {
            method: "POST",
            body: formData
        })
        .then(response => response.json())
        .catch(error => console.log('Alerta enviada a fondo:', error));

        // 3. Redirigimos de inmediato al perfil personal
        setTimeout(() => {
            window.location.href = 'perfilpersonal.html';
        }, 500);
    });
</script>
